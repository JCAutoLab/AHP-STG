[file]
traffic = ./data/GBA/flowgba.npz
meta = ./data/GBA/gba_meta.csv
adj = ./data/GBA/adj.npy
model = ./cpt/gba_graph_model
log = ./log/gba_graph_log
result = ./results/gba_graph_result.json
prediction = ./results/gba_graph_prediction.npz
pretrained = ./cpt/gba_future_model

[data]
input_len = 12
output_len = 12
train_ratio = 0.6
val_ratio = 0.2
test_ratio = 0.2

[train]
cuda = 2
max_epoch = 20
batch_size = 16
learning_rate = 0.0001
weight_decay = 0.0
seed = 1001
scheduler = warmup_cosine
warmup_epochs = 3
min_lr = 0.000005

[param]
factors = 128
layers = 5
tps = 12
tpn = 1
recur = 11
sps = 2
spn = 2048
nodes = 2352
tod = 96
dow = 7
id = 128
nd = 32
td = 32
dd = 32
merge_tau = 0.45
graph_bias = true
graph_bias_scale = 0.02
merge_temperature = 1.0
merge_target = -1.0
merge_reg_weight = 0.0
reset_refiner_res_scale = false
