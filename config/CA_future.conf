[file]
traffic = ./data/CA/flowca.npz
meta = ./data/CA/ca_meta.csv
adj = ./data/CA/adj.npy
model = ./cpt/ca_future_model
log = ./log/ca_future_log
result = ./results/ca_future_result.json
prediction = ./results/ca_future_prediction.npz
pretrained = ./cpt/ca_adaptive_stage3_model

[data]
input_len = 12
output_len = 12
train_ratio = 0.6
val_ratio = 0.2
test_ratio = 0.2

[train]
cuda = 0
max_epoch = 30
batch_size = 16
learning_rate = 0.0001
weight_decay = 0.0
seed = 1113
scheduler = warmup_cosine
warmup_epochs = 3
min_lr = 0.000005

[param]
factors = 8
layers = 5
tps = 12
tpn = 1
recur = 12
sps = 3
spn = 4096
nodes = 8600
tod = 96
dow = 7
id = 64
nd = 32
td = 32
dd = 32
merge_tau = 0.45
