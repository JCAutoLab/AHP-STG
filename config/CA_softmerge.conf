[file]
traffic = ./data/CA/flowca.npz
meta = ./data/CA/ca_meta.csv
adj = ./data/CA/adj.npy
model = ./cpt/ca_softmerge_model
log = ./log/ca_softmerge_log
result = ./results/ca_softmerge_result.json
prediction = ./results/ca_softmerge_prediction.npz
pretrained = ./cpt/ca_future_model

[data]
input_len = 12
output_len = 12
train_ratio = 0.6
val_ratio = 0.2
test_ratio = 0.2

[train]
cuda = 4
max_epoch = 20
batch_size = 16
learning_rate = 0.0001
weight_decay = 0.0
seed = 1113
scheduler = warmup_cosine
warmup_epochs = 3
min_lr = 0.000005

[param]
factors = 8
layers = 5
tps = 12
tpn = 1
recur = 12
sps = 3
spn = 4096
nodes = 8600
tod = 96
dow = 7
id = 64
nd = 32
td = 32
dd = 32
merge_tau = 0.45
graph_bias = false
graph_bias_scale = 0.0
merge_temperature = 1.5
merge_target = 0.35
merge_reg_weight = 0.05
reset_refiner_res_scale = true
