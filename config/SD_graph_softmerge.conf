[file]
traffic = ./data/SD/flowsd.npz
meta = ./data/SD/sd_meta.csv
adj = ./data/SD/adj.npy
model = ./cpt/sd_graph_softmerge_model
log = ./log/sd_graph_softmerge_log
result = ./results/sd_graph_softmerge_result.json
prediction = ./results/sd_graph_softmerge_prediction.npz
pretrained = ./cpt/sd_future_model

[data]
input_len = 12
output_len = 12
train_ratio = 0.6
val_ratio = 0.2
test_ratio = 0.2

[train]
cuda = 5
max_epoch = 20
batch_size = 16
learning_rate = 0.0001
weight_decay = 0.0
seed = 4098
scheduler = warmup_cosine
warmup_epochs = 3
min_lr = 0.000005

[param]
factors = 32
layers = 5
tps = 12
tpn = 1
recur = 9
sps = 2
spn = 512
nodes = 716
tod = 96
dow = 7
id = 64
nd = 64
td = 32
dd = 32
merge_tau = 0.45
graph_bias = true
graph_bias_scale = 0.05
merge_temperature = 1.5
merge_target = 0.35
merge_reg_weight = 0.05
reset_refiner_res_scale = true
