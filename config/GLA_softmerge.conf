[file]
traffic = ./data/GLA/flowgla.npz
meta = ./data/GLA/gla_meta.csv
adj = ./data/GLA/adj.npy
model = ./cpt/gla_softmerge_model
log = ./log/gla_softmerge_log
result = ./results/gla_softmerge_result.json
prediction = ./results/gla_softmerge_prediction.npz
pretrained = ./cpt/gla_future_model

[data]
input_len = 12
output_len = 12
train_ratio = 0.6
val_ratio = 0.2
test_ratio = 0.2

[train]
cuda = 6
max_epoch = 20
batch_size = 16
learning_rate = 0.0001
weight_decay = 0.0
seed = 113
scheduler = warmup_cosine
warmup_epochs = 3
min_lr = 0.000005

[param]
factors = 32
layers = 5
tps = 12
tpn = 1
recur = 11
sps = 2
spn = 2048
nodes = 3834
tod = 96
dow = 7
id = 64
nd = 32
td = 32
dd = 32
merge_tau = 0.45
graph_bias = false
graph_bias_scale = 0.0
merge_temperature = 1.5
merge_target = 0.35
merge_reg_weight = 0.05
reset_refiner_res_scale = true
